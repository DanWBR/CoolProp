name: Library builds (shared)

# Tags and manual runs only. This workflow compiles the full C++ library on
# five runners, so firing it on every push is expensive for little signal.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

concurrency:
  # Cancel superseded runs on the same ref to cut CI backlog on heavy
  # dev days (repeated pushes to an open PR).  Protected: master / main
  # / develop and tags never cancel, so mainline + release runs always
  # complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: Default is true, switch to false to allow one platform to fail and still run others
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a native aarch64 runner (no QEMU, no cross
        # toolchain) and supplies the linux-arm64 native. macOS-latest is
        # itself arm64, so osx-x64 needs an explicit extra leg further down.
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macOS-latest]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests packaging

    - name: Extract CoolProp version from CMakeLists.txt
      shell: bash
      run: |
        set -x
        COOLPROP_VERSION=$(python dev/extract_version.py --cmake-only)
        echo COOLPROP_VERSION=$COOLPROP_VERSION >> $GITHUB_ENV

    # cmake/dependencies.cmake fetches its CPM deps from network with no
    # cache, so every OS leg here re-downloads the same dependency set.
    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cpm_cache
        key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON

    - name: Build
      shell: bash
      # `nproc` is GNU coreutils: absent on macOS (and not a command in
      # Windows pwsh), so `$(nproc)` silently expands empty here, leaving a
      # bare `-j` — which goes *serial* on the macOS Unix Makefiles leg
      # (30+ min vs ~4 min on Linux). Resolve the core count portably and
      # under bash on all three runners. Mirrors csharp_builder.yml.
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: JSON symbol-leak gate (libCoolProp, Linux/macOS)
      # Fail if nlohmann/valijson/rapidjson symbols leak into libCoolProp's
      # dynamic export table. Rides the shared build produced above (ELF on
      # ubuntu, Mach-O on macOS) — no separate build. nm-based, so the Windows
      # PE legs are skipped (exports are opt-in via src/CoolPropLib.def).
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # Match the SONAME-versioned real file too: install gives libCoolProp.so
        # as a symlink to libCoolProp.so.<ver> (the regular file), and -type f
        # excludes the symlink — so name the versioned forms explicitly.
        lib=$(find build install_root -type f \( -name 'libCoolProp.so' -o -name 'libCoolProp.so.*' -o -name 'libCoolProp.dylib' -o -name 'libCoolProp.*.dylib' \) | head -1)
        if [ -z "$lib" ]; then
          echo "FAIL: libCoolProp shared object not found under build/ or install_root/" >&2
          exit 1
        fi
        echo "Gating $lib"
        ./dev/ci/check-json-symbols.sh "$lib"

    # Create a special case for Windows since we also need 2 flavours of 32bit binaries
    - name: Configure CMake for 32bit Windows stdcall
      if: startsWith(matrix.os, 'windows')
      run: cmake -B build_stdc  -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -DCOOLPROP_STDCALL_LIBRARY:BOOL=ON -A Win32
      
    - name: Build with CMake for 32bit Windows stdcall
      if: startsWith(matrix.os, 'windows')
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_stdc --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Configure CMake for 32bit Windows cdecl
      if: startsWith(matrix.os, 'windows')
      run: cmake -B build_cdecl -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -DCOOLPROP_CDECL_LIBRARY:BOOL=ON   -A Win32
      
    - name: Build with CMake for 32bit Windows cdecl
      if: startsWith(matrix.os, 'windows')
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_cdecl --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Configure CMake for 64bit Windows arm64
      if: startsWith(matrix.os, 'windows')
      run: cmake -B build_arm64 -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -A ARM64
      
    - name: Build with CMake for 64bit Windows arm64
      if: startsWith(matrix.os, 'windows')
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_arm64 --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    # macOS runners are arm64, so the default configure above yields osx-arm64.
    # x86_64 needs its own leg — and its OWN install prefix: the legacy
    # shared_library/Darwin/64bit path carries no architecture (the __arm64
    # suffix is MSVC-only), so installing both arches into install_root would
    # have this build silently replace the arm64 binary in the legacy artifact
    # that is still published below.
    - name: Configure CMake for macOS x86_64
      if: startsWith(matrix.os, 'macOS')
      run: cmake -B build_osx_x64 -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCOOLPROP_INSTALL_PREFIX=${{ github.workspace }}/install_root_osx_x64

    - name: Build with CMake for macOS x86_64
      if: startsWith(matrix.os, 'macOS')
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_osx_x64 --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Graft the macOS x86_64 native into the RID tree
      if: startsWith(matrix.os, 'macOS')
      shell: bash
      run: |
        set -euo pipefail
        src="${{ github.workspace }}/install_root_osx_x64/runtimes/osx-x64"
        if [ ! -d "$src" ]; then
          echo "FAIL: $src missing — the x86_64 build did not produce an osx-x64 RID folder" >&2
          exit 1
        fi
        mkdir -p install_root/runtimes
        cp -Rf "$src" install_root/runtimes/
        file install_root/runtimes/osx-x64/native/* || true

    # - name: Tar.gz the shared library to maintain case sensitivy and file permissions
    #   working-directory: ./install_root/shared_library/
    #   shell: bash
    #   run: |
    #     set -x
    #     tar -cvzf CoolProp-${{ env.COOLPROP_VERSION }}-shared-${{ matrix.os }}.tar.gz ./*

    - name: Archive artifacts
      uses: actions/upload-artifact@v7
      with:
          # Upload to unique artifact names tagged with suffix of matrix.os
          # This is now requried by upload-artifact@v4, but will be merged later
          name: shared_library-${{ matrix.os }}
          path: install_root/shared_library

    - name: Archive RID-keyed natives
      uses: actions/upload-artifact@v7
      with:
          name: runtimes-${{ matrix.os }}
          # win-x86 is excluded on purpose: it is out of scope for the .NET
          # package, and the stdcall and cdecl 32-bit legs both install into
          # runtimes/win-x86, so its contents would be whichever ABI ran last.
          path: |
            install_root/runtimes
            !install_root/runtimes/win-x86/**

    # - name: Upload TGZ or ZIP to release
    #   if: contains(github.ref, 'refs/tags')
    #   uses: svenstaro/upload-release-action@v2
    #   with:
    #     repo_token: ${{ secrets.GITHUB_TOKEN }}
    #     file: install_root/shared_library/CoolProp-${{ env.COOLPROP_VERSION }}-shared-${{ matrix.os }}.tar.gz
    #     tag: ${{ github.ref }}
    #     overwrite: true
    #     file_glob: false

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Merge Artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        # Merge all existing artifacts built above that start with pattern "shared_library-*"
        pattern: shared_library-*
        # Merge to single "shared_library" artifact
        name: shared_library
        # Remove the old individual artifacts once merged
        delete-merged: true

  merge_runtimes:
    runs-on: ubuntu-latest
    needs: build
    steps:
    # Safe to flatten into one tree only because every native now lives under
    # runtimes/<rid>/native — see the COOLPROP_RID block in CMakeLists.txt.
    # Merging the pre-RID layout would have let one architecture overwrite
    # another without error.
    - name: Merge runtime artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        pattern: runtimes-*
        name: runtimes
        delete-merged: true

  verify_runtimes:
    runs-on: ubuntu-latest
    needs: merge_runtimes
    steps:
    - name: Download merged runtimes
      uses: actions/download-artifact@v8
      with:
        name: runtimes
        path: rt

    - name: Assert all six desktop RIDs are present
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
          if compgen -G "rt/$rid/native/*" > /dev/null; then
            echo "ok   $rid"
          else
            echo "MISSING $rid" >&2
            missing=1
          fi
        done
        echo "--- tree ---"
        find rt -mindepth 1 -maxdepth 2 -type d | sort
        exit "$missing"
        
